<!-- Querry Slector-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document Object Model - DOM</title>
    <style>
      .bg-black {
        color: white;
        padding: 20px;
      }
    </style>
  </head>
  <body style="background-color: #212121; color: white">
    <div class="bg-black">
      <h2 id="title" class="heading">
        Document Object Model - DOM Learning
        <span style="display: none">Chai Our Code</span>
        <!-- 
        /* title.innerText -> 'Document Object Model - DOM Learning'
        title.textContent -> Document Object Model - DOM Learning Chai Our Code
        */ -->
      </h2>
      <p>
        DOM stands for Document Object Model. It is a programming interface for
        web documents.
      </p>

      <ul>
        <li class="list-item">one</li>
        <li class="list-item">two</li>
        <li class="list-item">three</li>
        <li class="list-item">four</li>
      </ul>
    </div>
    <div class="parent">
      <div class="day">Monday</div>
      <div class="day">Tuesday</div>
      <div class="day">Wednesday</div>
      <div class="day">Thursday</div>
    </div>


    <script>
      let parent = document.querySelector(".parent");
      console.log(parent.children);
      console.log(parent.children[0].innerHTML);

      for (let index = 0; index < parent.children.length; index++) {
        const element = parent.children[index];
        console.log(element.innerHTML);
      }

      parent.children[0].style.backgroundColor = "red";
      parent.children[1].style.backgroundColor = "green";
      parent.children[2].style.backgroundColor = "blue";
      console.log(parent.firstElementChild);
      console.log(parent.lastElementChild);
      console.log(parent.childNodes);
       const day1= document.querySelector(".day")
      console.log(day1.nextElementSibling);
      console.log(day1.parentElement);
  
       let div = document.createElement('div')
       div.className = 'main'
       div.id= Math.round(Math.random()*10+1)
      //  console.log(div.id);
        div.setAttribute('title', 'this is a div element')
        div.style.backgroundColor = 'red'
        // div.innerHTML = 'This is a div element'
      
         let node = document.createTextNode("Chai and code")

         div.appendChild(node)
         document.body.appendChild(div)


       
    </script>
  </body>
</html>
