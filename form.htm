<!DOCTYPE html>
<html>
<head><title>Complete Form Example</title></head>
<body>
<form action="abc.php" method="post" >
  
  <!-- Text inputs -->
  <label for="fname">First Name:</label>
  <input type="text" id="fname" name="fname" required><br><br>
  
  <label for="lname">Last Name:</label>
  <input type="text" id="lname" name="lname" required><br><br>
  
  <!-- Email and password -->
  <label for="email">Email:</label>
  <input type="email" id="email" name="email" required><br><br>
  
  <label for="password">Password:</label>
  <input type="password" id="password" name="password" minlength="8" required><br><br>
  
  <!-- Number, range, date -->
  <label for="age">Age:</label>
  <input type="number" id="age" name="age" min="18" max="100" required><br><br>
  
  <label for="birthdate">Birth Date:</label>
  <input type="date" id="birthdate" name="birthdate" required><br><br>
  
  <label for="rating">Rating (1-10):</label>
  <input type="range" id="rating" name="rating" min="1" max="10" value="5"><br><br>
  
  <!-- Select dropdown -->
  <label for="country">Country:</label>
  <select id="country" name="country" required>
    <option value="">Select Country</option>
    <option value="US">United States</option>
    <option value="CA">Canada</option>
    <option value="PK">Pakistan</option>
  </select><br><br>

  
  <!-- Radio buttons -->
  <p>Gender:</p>
  <input type="radio" id="male" name="gender" value="male">
  <label for="male">Male</label>
  <input type="radio" id="female" name="gender" value="female">
  <label for="female">Female</label>
  <input type="radio" id="other" name="gender" value="other">
  <label for="other">Other</label><br><br>



<p>Fruits:</p>
  <input type="radio" id="ap" name="Fruit" value="ap">
  <label for="apple">Apple</label>
  <input type="radio" id="Ora" name="Fruit" value="Or">
  <label for="or">Orange</label>
  <input type="radio" id="other" name="Fruit" value="other">
  <label for="other">Other</label><br><br>
  
  
  <!-- Checkboxes -->
  <p>Hobbies:</p>
  <input type="checkbox" id="reading" name="hobbies" value="reading">
  <label for="reading">Reading</label><br>
  <input type="checkbox" id="sports" name="hobbies" value="sports">
  <label for="sports">Sports</label><br>
  <input type="checkbox" id="music" name="hobbies" value="music">
  <label for="music">Music</label><br><br>
  
  <!-- Textarea -->
  <label for="message">Message:</label><br>
  <textarea id="message" name="message" rows="4" cols="50" maxlength="500" required></textarea><br><br>
  
  <!-- File upload -->
  <label for="resume">Upload Resume:</label>
  <input type="file" id="resume" name="resume" accept=".pdf,.doc"><br><br>
  
  <!-- Fieldset grouping -->
  <fieldset>
    <legend>Preferences</legend>
    <label><input type="checkbox" name="newsletter"> Subscribe to newsletter</label><br>
    <label><input type="checkbox" name="terms" required> Accept terms</label>
  </fieldset><br>
  
  <!-- Buttons -->
  <button type="submit">Submit Form</button>
  <button type="reset">Reset</button>
  <button type="button">Cancel</button>
  
</form>
</body>
</html>
