<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fixed n LOCAL BACKGROUND </title>
    <style>
	.fixed {
  height: 200px;
  background-image: url("https://picsum.photos/800/600");
  background-attachment: fixed;
  background-size: cover;
  color: white;
}

.local {
  height: 200px;
  overflow: auto;
  background-image: url("https://picsum.photos/800/600");
  background-attachment: local;
  background-size: cover;
  color: red;
}
</style>
</head>
<body>

   <div class="fixed">FIXED BACKGROUND</div>

<div class="local">
  LOCAL BACKGROUND<br><br>
  Scroll inside me<br><br>
  Scroll inside me<br><br>
  Scroll inside me<br><br>
  Scroll inside me<br><br>
  Scroll inside me<br><br>
</div>
</body>
</html>
