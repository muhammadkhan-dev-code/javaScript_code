<!DOCTYPE html>
<html>
<head>
<title>CSS Selectors Demo</title>

<style>

/* ELEMENT SELECTOR */
p {
  color: blue;
}

/* CLASS SELECTOR */
.box {
  background-color: lightblue;
  padding: 40px;
  margin: 30px;
}

#box {
  background-color: red;
  padding: 10px;
  margin: 10px;
}

/* ID SELECTOR */
#title {
  color: red;
  text-align: center;
}

</style>
</head>

<body>

<h1 id="title">CSS Selectors Example</h1>

<p>This paragraph is styled using ELEMENT selector.</p>

<div id="box">This div uses id selector.</div>

<div class="box">This div uses CLASS selector.</div>

<div class="box">Another div using same CLASS.</div>

<p>Another paragraph using ELEMENT selector.</p>

</body>
</html>
